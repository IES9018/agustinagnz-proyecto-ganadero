name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build, tests and contract validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: 08_CODIGO_FUENTE
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pytest

      - name: Compile Python files
        working-directory: 08_CODIGO_FUENTE
        run: |
          python -m compileall -q src tests

      - name: Run automated tests
        working-directory: 08_CODIGO_FUENTE
        run: |
          python -m pytest -q

      - name: Generate coverage report
        working-directory: 08_CODIGO_FUENTE
        run: |
          python -m coverage run --source=src -m pytest -q
          python -m coverage report -m

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate OpenAPI contract
        run: |
          npx --yes @redocly/cli lint docs/arquitectura/api-contracts.yaml

      - name: Install commitlint
        run: |
          npm install --no-save --no-package-lock \
            @commitlint/cli@21.2.2 \
            @commitlint/config-conventional@21.2.2

      - name: Determine commit range
        id: commit-range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "from=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "to=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "from=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "to=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate commit messages
        shell: bash
        run: |
          FROM="${{ steps.commit-range.outputs.from }}"
          TO="${{ steps.commit-range.outputs.to }}"

          if [ "$FROM" = "0000000000000000000000000000000000000000" ]; then
            npx commitlint --from "$TO^" --to "$TO" --verbose
          else
            npx commitlint --from "$FROM" --to "$TO" --verbose
          fi