name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: 08_CODIGO_FUENTE
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install commitlint
        run: |
          npm install --no-save --no-package-lock @commitlint/cli@21.2.2 @commitlint/config-conventional@21.2.2

      - name: Determine commit range
        id: commit-range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "from=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "to=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "from=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "to=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate commit messages
        shell: bash
        run: |
          FROM="${{ steps.commit-range.outputs.from }}"
          TO="${{ steps.commit-range.outputs.to }}"

          if [ "$FROM" = "0000000000000000000000000000000000000000" ]; then
            echo "Validando el commit actual..."
            npx commitlint --from "$TO^" --to "$TO" --verbose
          else
            echo "Validando commits desde $FROM hasta $TO..."
            npx commitlint --from "$FROM" --to "$TO" --verbose
          fi