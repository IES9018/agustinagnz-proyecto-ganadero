<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}GanadApp{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">

    {% block extra_css %}{% endblock %}

</head>

<body>

<header class="topbar">

    <div class="brand">

        <img
            src="{{ url_for('static', path='img/logo.png') }}"
            alt="Logo GanadApp"
            class="logo-main">

        <span class="brand-name">
            GanadApp
        </span>

    </div>

    <nav class="menu">

        <button onclick="location.href='/'">
                <img src="/static/img/icon-panel.png" alt="Inicio">
                <span>Inicio</span>
        </button>

        <button onclick="location.href='/'">
            <img src="{{ url_for('static', path='img/icon-inicio.png') }}" alt="">
            Inicio de Sesión
        </button>


        <button>
            <img src="{{ url_for('static', path='img/icon-productores.png') }}" alt="">
            Productores
        </button>

        <button onclick="location.href='/animales'">
            <img src="{{ url_for('static', path='img/icon-animales.png') }}" alt="">
            Gestión de Animales
        </button>

        <button onclick="location.href='/sanidad'">
            <img src="{{ url_for('static', path='img/icon-vacunacion.png') }}" alt="">
            Vacunación
        </button>

        <button>
            <img src="{{ url_for('static', path='img/icon-stock.png') }}" alt="">
            Stock
        </button>

        <button onclick="location.href='/trazabilidad'">
            <img src="{{ url_for('static', path='img/icon-trazabilidad.png') }}" alt="">
            Trazabilidad
        </button>


    </nav>

</header>

<main>

    {% block content %}
    {% endblock %}

</main>

<footer>

    © 2026 GanadApp - Soluciones de Gestión Ganadera - Todos los derechos reservados

</footer>

{% block extra_js %}
{% endblock %}

<script src="/static/js/auth.js"></script>
</body>

</html>
